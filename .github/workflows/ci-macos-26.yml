name: CI macOS 26

on:
  workflow_call:
  pull_request:

concurrency:
  group: ci-macos-26-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: macOS 26 arm64 quality gates
    runs-on: macos-26
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings

    steps:
      - uses: actions/checkout@v7

      # Keep in sync with `rust-version` in Cargo.toml.
      - name: Install Rust 1.99.1 (repo target)
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry / git / target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-26-cargo-ci-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: macos-26-cargo-ci-

      - name: rustfmt --check
        run: cargo fmt --all -- --check

      - name: clippy (all targets / all features, -D warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: cargo test --release
        run: cargo test --release --locked

      - name: cargo test --release --features bench
        run: cargo test --release --locked --features bench

      - name: cargo build --release
        run: cargo build --release --locked

      - name: cargo build --release --features bench
        run: cargo build --release --locked --features bench
