name: Release Build Ubuntu 22.04

on:
  workflow_call:

jobs:
  build:
    name: Build Ubuntu 22.04 x64 release artifact
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      CARGO_ABOUT_VERSION: 0.9.2
      CARGO_TERM_COLOR: always
      RELEASE_ASSET_NAME: fast-diff-viewer-ubuntu-22.04-x64.tar.gz

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Cache cargo registry / git / target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-22.04-cargo-release-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: ubuntu-22.04-cargo-release-

      - name: Install cargo-about 0.9.2
        run: cargo install cargo-about --version "$CARGO_ABOUT_VERSION" --features cli --locked --force

      - name: Fetch release dependency graph
        run: cargo fetch --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage Ubuntu 22.04 release artifact
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          mkdir -p "$RUNNER_TEMP/release/share/applications"
          mkdir -p "$RUNNER_TEMP/release/share/icons/hicolor/scalable/apps"
          cp target/release/fast-diff-viewer "$RUNNER_TEMP/release/fast-diff-viewer"
          cp assets/linux/fast-diff-viewer.desktop "$RUNNER_TEMP/release/share/applications/fast-diff-viewer.desktop"
          cp assets/icon/fast-diff-viewer.svg "$RUNNER_TEMP/release/share/icons/hicolor/scalable/apps/fast-diff-viewer.svg"
          cp LICENSE-MIT "$RUNNER_TEMP/release/LICENSE-MIT"
          cp LICENSE-APACHE "$RUNNER_TEMP/release/LICENSE-APACHE"
          cargo about generate legal/third-party-notices.hbs --config legal/about.toml --locked --offline --fail --output-file "$RUNNER_TEMP/release/THIRD-PARTY-NOTICES.md"
          chmod +x "$RUNNER_TEMP/release/fast-diff-viewer"
          tar -czf "$RUNNER_TEMP/$RELEASE_ASSET_NAME" -C "$RUNNER_TEMP/release" fast-diff-viewer share LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md

      - name: Upload Ubuntu 22.04 release artifact
        uses: actions/upload-artifact@v7
        with:
          name: fast-diff-viewer-ubuntu-22.04-x64
          path: ${{ runner.temp }}/${{ env.RELEASE_ASSET_NAME }}
          if-no-files-found: error
