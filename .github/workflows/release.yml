name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  version-preflight:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag and Cargo package versions match
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          lock = tomllib.loads(pathlib.Path("Cargo.lock").read_text())
          package = manifest["package"]
          expected_tag = f"v{package['version']}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(f"Release tag must be {expected_tag}")
          locked = [
              entry for entry in lock["package"]
              if entry["name"] == package["name"] and "source" not in entry
          ]
          if len(locked) != 1 or locked[0]["version"] != package["version"]:
              raise SystemExit("Cargo.lock package version must match Cargo.toml")
          print(f"Verified {expected_tag} in Cargo.toml and Cargo.lock")
          PY

  ci-windows:
    name: CI Windows
    needs: version-preflight
    uses: ./.github/workflows/ci-windows.yml

  ci-ubuntu-22-04:
    name: CI Ubuntu 22.04
    needs: version-preflight
    uses: ./.github/workflows/ci-ubuntu-22.04.yml

  ci-ubuntu-24-04:
    name: CI Ubuntu 24.04
    needs: version-preflight
    uses: ./.github/workflows/ci-ubuntu-24.04.yml

  ci-macos-26:
    name: CI macOS 26
    needs: version-preflight
    uses: ./.github/workflows/ci-macos-26.yml

  ci-markdown:
    name: CI Markdown
    needs: version-preflight
    uses: ./.github/workflows/ci-markdown.yml

  build-windows:
    name: Build Windows release artifact
    needs: [ci-windows, ci-ubuntu-22-04, ci-ubuntu-24-04, ci-macos-26, ci-markdown]
    uses: ./.github/workflows/release-build-windows.yml

  build-ubuntu-22-04:
    name: Build Ubuntu 22.04 release artifact
    needs: [ci-windows, ci-ubuntu-22-04, ci-ubuntu-24-04, ci-macos-26, ci-markdown]
    uses: ./.github/workflows/release-build-ubuntu-22.04.yml

  build-ubuntu-24-04:
    name: Build Ubuntu 24.04 release artifact
    needs: [ci-windows, ci-ubuntu-22-04, ci-ubuntu-24-04, ci-macos-26, ci-markdown]
    uses: ./.github/workflows/release-build-ubuntu-24.04.yml

  build-macos-26:
    name: Build macOS 26 release artifact
    needs: [ci-windows, ci-ubuntu-22-04, ci-ubuntu-24-04, ci-macos-26, ci-markdown]
    uses: ./.github/workflows/release-build-macos-26.yml

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-ubuntu-22-04, build-ubuntu-24-04, build-macos-26]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List release artifacts
        run: ls -la dist

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum \
            fast-diff-viewer-windows-x64.zip \
            fast-diff-viewer-ubuntu-22.04-x64.tar.gz \
            fast-diff-viewer-ubuntu-24.04-x64.tar.gz \
            fast-diff-viewer-macos-26-arm64.tar.gz \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release and upload artifacts
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/fast-diff-viewer-windows-x64.zip \
            dist/fast-diff-viewer-ubuntu-22.04-x64.tar.gz \
            dist/fast-diff-viewer-ubuntu-24.04-x64.tar.gz \
            dist/fast-diff-viewer-macos-26-arm64.tar.gz \
            dist/SHA256SUMS.txt \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
