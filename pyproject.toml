[project]
name = "fdv-benchmark-plotter"
version = "0.1.0"
description = "Repo-local helper for plotting Fast Diff Viewer benchmark distributions."
authors = [{ name = "Michelle Welcks" }]
readme = "scripts/README.md"
requires-python = ">=3.13,<4.0"
dependencies = ["matplotlib>=3.11.2,<4.0.0"]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
flake8 = "^7.4.1"
pyright = "^1.1.414"

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
